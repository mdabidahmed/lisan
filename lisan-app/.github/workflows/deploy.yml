name: Deploy to GitHub Pages

# The git repository root is one level above the app, so every `run` step needs to hop
# into ./lisan-app while action inputs (paths, artifacts) stay repository-relative.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./lisan-app

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: lisan-app/.nvmrc
          cache: npm
          cache-dependency-path: lisan-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_PAGES: 'true'
        run: npm run build

      # GitHub Pages has no server-side rewrites: a deep-link refresh (e.g. /lisan/practice)
      # would 404. Serving the same SPA shell as the 404 page lets `createBrowserRouter`'s
      # `basename` pick the route up client-side instead.
      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lisan-app/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
