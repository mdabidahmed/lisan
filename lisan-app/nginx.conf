# Lisan production server. Mounted at /etc/nginx/conf.d/default.conf, so this file is
# evaluated inside the stock `http { }` block of the nginx:1.27-alpine image.

# Cache-Control is chosen from the request URI once, at server level, instead of with
# per-location `add_header`. nginx's add_header inheritance is replace-not-merge: a single
# add_header inside a location silently drops every header declared on the server, which is
# how security headers usually go missing. One map keeps all of them in one place.
map $uri $lisan_cache_control {
    # Anything unhashed but not explicitly listed: short cache, always revalidated.
    default                                "public, max-age=3600, must-revalidate";

    # Vite writes content-hashed filenames here, so the URL changes whenever bytes change.
    ~^/assets/                             "public, max-age=31536000, immutable";

    # The PWA update path. If any of these are cached the app can pin itself to a dead build.
    ~^/$                                   "no-cache, must-revalidate";
    ~^/index\.html$                        "no-cache, must-revalidate";
    ~^/sw\.js$                             "no-cache, must-revalidate";
    ~^/registerSW\.js$                     "no-cache, must-revalidate";
    ~^/workbox-[^/]+\.js$                  "no-cache, must-revalidate";
    ~^/manifest\.webmanifest$              "no-cache, must-revalidate";
}

server {
    # IPv4 only: `listen [::]:8080` aborts startup on hosts where the container has no IPv6
    # stack. Add it explicitly when deploying to a dual-stack or IPv6-only cluster.
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # The SPA never uploads anything, so keep the request body ceiling small.
    client_max_body_size 1m;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # The Docker build pre-compresses dist with `gzip -9 -k` and `brotli -q 11 -k`, so nginx
    # serves the .gz/.br sibling instead of compressing on every request.
    gzip_static on;

    # `brotli_static` lives in ngx_brotli, which the official nginx:1.27-alpine image does
    # NOT ship — writing the directive here unconditionally would make nginx refuse to
    # start. A wildcard include is the only guard nginx offers: a glob that matches nothing
    # is not an error, whereas a literal `include` of a missing file is. Build an image with
    # ngx_brotli compiled in and drop a file containing `brotli_static on;` into that
    # directory to enable it; the .br files are already on disk either way.
    include /etc/nginx/conf.d/brotli-enabled/*.conf;

    # ── Headers applied to every response ────────────────────────────────────
    add_header Cache-Control        $lisan_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options      DENY always;
    add_header Referrer-Policy      strict-origin-when-cross-origin always;

    # Lisan has a microphone practice mode (`microphone` icon / speech input), so the mic
    # stays available to same-origin code. Everything else the app never uses is denied.
    add_header Permissions-Policy   "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

    # CSP notes, in full, because `script-src` here is the one real compromise:
    #
    #   script-src  index.html carries one inline <script>: the anti-FOUC bootstrap that
    #               reads the persisted theme before first paint. Vite emits every other
    #               script as an external, same-origin file, so 'self' covers the bundle,
    #               /registerSW.js and /sw.js. The inline bootstrap needs either
    #               'unsafe-inline', a 'sha256-…' source, or a per-response nonce.
    #               'unsafe-inline' is shipped here because the hash changes every time
    #               index.html changes and a stale hash silently reintroduces the theme
    #               flash. To harden a real deployment, compute the hash at release time
    #               and replace the token — a hash or nonce makes browsers ignore
    #               'unsafe-inline' automatically, so it is a one-token edit:
    #                   script-src 'self' 'sha256-<base64 of the inline script body>';
    #               Residual risk is bounded: there is no server-rendered HTML and no user
    #               content is ever interpolated into the document, so the injection vector
    #               that 'unsafe-inline' normally opens up does not exist here.
    #   style-src   'unsafe-inline' is required: React sets inline `style` attributes for
    #               progress bars, rings and accent colours. fonts.googleapis.com is the
    #               stylesheet src/styles/webfonts injects when a learner picks Amiri,
    #               Noto Nastaliq Urdu, Spectral or IBM Plex Mono — nothing requests it
    #               otherwise, but the origin has to be allowed for the request to be made
    #               at all.
    #   font-src    the two hosts those faces are actually served from: gstatic for the
    #               Google families, verses.quran.foundation for the IndoPak nastaleeq
    #               declared in src/styles/fonts.css. Omitting either turns the preference
    #               into a silent no-op — the page keeps working, but the chosen face never
    #               arrives and the console fills with CSP violations.
    #   img-src     blob: covers object URLs used for generated/illustration images.
    #   connect-src 'self' plus the same font hosts. The page fetches fonts under font-src,
    #               but the service worker re-fetches them through Workbox's runtime caching
    #               rules, and a `fetch()` from worker script is governed by connect-src.
    #               Widen this further when a real API host is introduced.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://verses.quran.foundation; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://verses.quran.foundation; manifest-src 'self'; worker-src 'self' blob:; media-src 'self' blob:" always;

    # ── Routes ───────────────────────────────────────────────────────────────

    # Container/orchestrator liveness probe. No add_header here on purpose: adding one
    # would drop the inherited header set for this location.
    location = /health {
        access_log   off;
        default_type text/plain;
        return 200 "ok";
    }

    # nginx's bundled mime.types does not reliably map .webmanifest, and a wrong type makes
    # Chrome ignore the manifest entirely.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location = /sw.js {
        types { }
        default_type application/javascript;
    }

    # Content-hashed bundles and fonts. `access_log off` keeps the log readable.
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Brand, favicon and PWA icons. Stable URLs (not content-hashed), so cache for a day only.
    location /brand/ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
    }

    # Client-side routing: every unknown path is a React Router route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
